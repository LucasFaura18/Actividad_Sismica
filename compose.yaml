# Cinco servicios obligatorios. El panel Angular se publica en Netlify
# y ngrok se arranca aparte: Kafka y PostgreSQL no salen por el túnel.

x-python: &python
  image: observatorio-python:local
  build: ./backend
  environment:
    KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
    KAFKA_TOPIC: ${KAFKA_TOPIC:-terremotos.live}
    KAFKA_GROUP: ${KAFKA_GROUP:-observatorio-consumidor}
    KAFKA_TOPIC_RETENTION_MS: ${KAFKA_TOPIC_RETENTION_MS:-259200000}
    POLL_SECONDS: ${POLL_SECONDS:-60}
    POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_DB: ${POSTGRES_DB:-observatorio}
    POSTGRES_USER: ${POSTGRES_USER:-observatorio}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observatorio_local}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
  restart: unless-stopped
  init: true

services:
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    # El volumen nuevo pertenece a root. La imagen oficial entra como appuser
    # y no puede formatear los logs de KRaft. Este usuario solo aplica al broker local.
    user: "0:0"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-observatorio}
      POSTGRES_USER: ${POSTGRES_USER:-observatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observatorio_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./sql/002_extraccion.sql:/docker-entrypoint-initdb.d/002_extraccion.sql:ro
      - ./sql/003_modelo.sql:/docker-entrypoint-initdb.d/003_modelo.sql:ro
      - ./sql/004_dimensiones.sql:/docker-entrypoint-initdb.d/004_dimensiones.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  productor:
    <<: *python
    command: ["python", "-m", "src.productor"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; pathlib.Path('/tmp/ready').read_text()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  consumidor:
    <<: *python
    command: ["python", "-m", "src.consumidor"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      # El consumidor necesita el catálogo geográfico para enriquecer eventos
      - ./recursos/observatorio-sismico/frontend/public/datos/paises.geojson:/app/datos/paises.geojson:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; pathlib.Path('/tmp/ready').read_text()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    <<: *python
    command: ["python", "-m", "uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  kafka_data:
  postgres_data:
